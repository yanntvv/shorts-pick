<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Hot Pick 쇼핑몰</title>
  <meta name="description" content="쇼츠·릴스 영상 속 화제의 꿀템 & 실시간 쿠팡·네이버 최저가 핫딜 모음전" />
  
  <!-- Open Graph -->
  <meta property="og:title" content="Hot Pick 쇼핑몰 - 쿠팡·네이버 최저가 핫딜전" />
  <meta property="og:description" content="영상 속 화제의 꿀템! 쿠팡 최저가 및 네이버쇼핑몰 혜택으로 바로 만나보세요." />
  <meta property="og:type" content="website" />
  
  <!-- Favicon and Brand Icons -->
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="apple-touch-icon" href="./logo.png" />
  <link rel="stylesheet" href="./style.css?v=5" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <!-- 상단 실시간 핫딜 띠배너 -->
  <aside class="live-ticker-bar">
    <div class="live-ticker-inner">
      <span class="live-dot-pulse"></span>
      <span class="live-tag">실시간 핫딜</span>
      <span id="site-announcement" class="ticker-text">🔥 [실시간 핫딜] 쿠팡 로켓배송 & 네이버페이 추가적립 최저가전!</span>
    </div>
  </aside>

  <div class="container">
    <!-- 헤더 프로필 영역 -->
    <header class="profile-section">
      <div class="profile-avatar">
        <img src="./logo.png" alt="Pick & Buy Logo" class="avatar-brand-img" />
      </div>
      <h1 id="site-title" class="profile-name">Hot Pick 쇼핑몰</h1>
      <p id="site-desc" class="profile-bio">쇼츠·릴스 영상 속 화제의 꿀템 & 실시간 특가 모음전</p>
      
      <!-- 실시간 검색 바 -->
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="영상 속 상품명 또는 키워드를 검색해보세요" />
      </div>

      <!-- 카테고리 탭 (이커머스 메뉴 규격) -->
      <nav id="category-tabs" class="category-tabs">
        <button class="cat-btn active" data-cat="all">전체보기</button>
      </nav>
    </header>

    <!-- 상품 카드 리스트 영역 -->
    <main>
      <div id="product-list" class="product-grid">
        <!-- JS로 동적 렌더링 -->
        <div class="loading-state">
          <div class="spinner"></div>
          <p>핫딜 특가 상품을 불러오는 중...</p>
        </div>
      </div>
    </main>

    <!-- 공정위 필수 표기 및 푸터 -->
    <footer class="footer-section">
      <div class="disclosure-box">
        <p>⚠️ <strong>제휴 마케팅 활동 안내 (공정거래위원회 지침 준수)</strong></p>
        <p>본 페이지는 쿠팡 파트너스 및 네이버 커넥트/쇼핑 제휴 활동의 일환으로 수수료를 제공받을 수 있으며, 구매자에게 발생하는 추가 비용은 일체 없습니다.</p>
      </div>
      <p class="copyright">© <span id="current-year"></span> All Rights Reserved.</p>
    </footer>
  </div>

  <script src="./app.js?v=5"></script>
</body>
</html>
